{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper animate-fade-in">
    <div class="auth-card" style="max-width: 480px; text-align: center;">
        <div class="auth-card-header">
            <span style="font-size: 4rem; color: var(--color-danger); display: block; margin-bottom: 1rem;">
                <i class="fa-solid fa-circle-xmark"></i>
            </span>
            <h2 style="font-size: 2.2rem; font-weight: 800;">403</h2>
            <p style="font-size: 1.1rem; color: var(--text-primary); margin-top: 0.5rem; font-weight: 600;">Access Forbidden</p>
        </div>
        <div class="auth-form" style="margin-top: 1rem;">
            <p style="color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem; margin-bottom: 1.5rem;">
                You do not have permission to access this resource. If this is a mistake, please check your login credentials and try again.
            </p>
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-house" style="margin-right: 0.5rem;"></i> Go back Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
